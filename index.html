      b.hidden = !n; b.textContent = n > 99 ? "99+" : n;
    }
    function bar(k, l, n){ var t = k + l + n || 1; return '<span class="pbar" aria-hidden="true"><i class="pk" style="width:'+(k/t*100)+'%"></i><i class="pl" style="width:'+(l/t*100)+'%"></i></span>'; }
    function renderProgress(){
      var tot = { known: 0, learning: 0, "new": 0 }, per = {};
      pool.forEach(function(c){ var lv = level(c); tot[lv]++; per[c.src] = per[c.src] || { known: 0, learning: 0, "new": 0 }; per[c.src][lv]++; });
      var st = streak(), td = todayRound(), tn = td.list.length;
      var tday = '<div class="today' + (tn ? '' : ' done') + '"><div class="today-txt"><b>' + (tn ? 'Today: ' + tn + ' card' + (tn > 1 ? 's' : '') : 'All done for today ✓') + '</b><span>' +
        (tn ? td.due.length + ' to review · ' + td.fresh.length + ' new · from all lessons and sections' : 'Come back tomorrow, or shuffle below') + '</span></div>' +
        (tn ? '<button type="button" class="today-go" id="fcToday">Start</button>' : '') + '</div>';
      var h = tday + '<div class="prog-head"><span class="prog-title">Your progress</span><span class="streak-pill' + (st ? ' on' : '') + '"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c.6 3.2-1 5.2-2.6 7C7.8 10.8 6.5 12.5 6.5 15a5.5 5.5 0 0 0 11 0c0-2.1-.9-3.8-2.2-5.2-.3 1.4-1 2.4-2.1 2.9.4-3.6-.6-7.6-1.2-10.7z"/></svg>' + (st ? st + '-day streak' : 'No streak yet') + '</span></div>' +
        '<div class="stats"><div class="stat s-k"><b>' + tot.known + '</b><span>Known</span></div><div class="stat s-l"><b>' + tot.learning + '</b><span>Learning</span></div><div class="stat s-n"><b>' + tot["new"] + '</b><span>New</span></div></div>';
      h += bar(tot.known, tot.learning, tot["new"]);
      h += '<details class="prog-det"><summary>Progress by lesson</summary><div class="prog-rows">';
      sources.forEach(function(s){ var p = per[s.id]; if (!p) return; var t = p.known + p.learning + p["new"]; h += '<div class="prow"><span>' + esc(s.label) + '</span>' + bar(p.known, p.learning, p["new"]) + '<span class="pn">' + p.known + '/' + t + '</span></div>'; });
      h += '</div><p class="hint" style="margin:8px 0 0">Known = right 3 times in a row, spaced over days.</p></details>';
      $("fcProgress").innerHTML = h;
    }
    function renderSetup(){
      Array.prototype.forEach.call(document.querySelectorAll("#fcSetup .seg"), function(g){
        var opt = g.getAttribute("data-opt");
        Array.prototype.forEach.call(g.children, function(b){ b.setAttribute("aria-checked", b.getAttribute("data-v") === cfg[opt] ? "true" : "false"); });
      });
      var favN = pool.filter(function(c){ return isFav(c.ja); }).length;
      function chip(s){ return '<button type="button" data-src="'+s.id+'" aria-pressed="'+(cfg.src[s.id] ? "true" : "false")+'"'+(cfg.favOnly ? ' disabled' : '')+'>'+esc(s.label)+'</button>'; }
      function group(name, title, list){
        if (!list.length) return "";
        var on = list.filter(function(s){ return cfg.src[s.id]; }).length;
        return '<div class="src-group' + (cfg.favOnly ? ' off' : '') + '"><div class="src-head"><span class="src-title">' + title + ' <span class="src-n">' + on + '/' + list.length + '</span></span>' +
          '<span class="src-q"><button type="button" data-srcset="' + name + ':all"' + (cfg.favOnly ? ' disabled' : '') + '>All</button><button type="button" data-srcset="' + name + ':none"' + (cfg.favOnly ? ' disabled' : '') + '>None</button></span></div>' +
          '<div class="chips">' + list.map(chip).join("") + '</div></div>';
      }
      var lessonsSrc = sources.filter(function(s){ return /^L\d/.test(s.id); }), otherSrc = sources.filter(function(s){ return !/^L\d/.test(s.id); });
      $("fcSources").innerHTML =
        '<button type="button" class="switch-row" data-favonly role="switch" aria-checked="'+(cfg.favOnly ? "true" : "false")+'"><span class="sw-star" aria-hidden="true">★</span><span class="sw-text"><b>Favorites only</b><small>' + (favN ? favN + ' starred card' + (favN > 1 ? 's' : '') : 'Star cards with ★ to build this deck') + '</small></span><span class="switch" aria-hidden="true"></span></button>' +
        group("lessons", "Lessons", lessonsSrc) + group("other", "Phrase sections", otherSrc);
      var f = filtered(), d = dueSplit(f), n = selection().length;
      $("fcModeHint").textContent = cfg.mode === "due"
        ? ("In your selection: " + d.due.length + " to review · " + d.fresh.length + " new (max " + NEW_PER_DAY + " new a day)")
        : f.length + " cards in your selection, shuffled. Answers still count for spaced repetition.";
      $("fcStart").textContent = n ? "Start · " + n + " cards" : (cfg.mode === "due" ? "All done for today ✓" : "No cards for this choice");
      $("fcStart").disabled = !n;
      renderProgress(); updateBadge();
    }
    function view(which){ $("fcSetup").hidden = which !== "setup"; $("fcPlay").hidden = which !== "play"; $("fcDone").hidden = which !== "done"; }
    function start(list, forceDir){
      var dd = forceDir || cfg.dir;
      queue = shuffle(list.map(function(c){ return { c: c, dir: dd === "mix" ? (Math.random() < .5 ? "je" : "ej") : dd, missed: false }; }));
      total = queue.length; done = 0; firstTry = 0; missed = []; missedKeys = {};
      view("play"); next(); window.scrollTo(0,0);
    }
    function setStar(){ var on = isFav(cur.c.ja); $("fcStar").setAttribute("aria-pressed", on ? "true" : "false"); $("fcStar").setAttribute("data-fav", cur.c.ja); }
    function next(){
      if (!queue.length){ finish(); return; }
      cur = queue.shift(); flipped = false;
      var c = cur.c, lv = level(c);
      $("fcProg").textContent = (done + 1) + " / " + total + (firstTry ? "  ·  ✓ " + firstTry : "");
      $("fcBarFill").style.width = Math.round(done / total * 100) + "%";
      $("fcTag").textContent = (cur.dir === "je" ? "Japanese → English" : "English → Japanese") + (lv === "new" ? " · new" : "");
      var f = $("fcFront");
      if (cur.dir === "je"){ f.className = "fc-front ja"; f.innerHTML = jaHTML(c.ja, c.ro) + '<span class="ro">' + esc(c.ro) + '</span>'; }
      else { f.className = "fc-front"; f.textContent = cleanEn(c.en, c.ro); }
      $("fcBack").hidden = true; $("fcNote").hidden = true; $("fcTap").hidden = false; $("fcActions").hidden = true;
      $("fcSpeak").style.visibility = cur.dir === "je" ? "visible" : "hidden";
      $("fcSpeak").setAttribute("data-say", c.ja);
      setStar();
    }
    function flip(){
      if (!cur || flipped) return;
      flipped = true; var c = cur.c, h = "";
      if (cur.dir === "je") h = (document.body.classList.contains("no-ro") ? '<span class="ro">' + esc(c.ro) + '</span>' : '') + '<span class="en">' + esc(c.en) + '</span>' + (c.sl ? '<span class="sl">' + esc(c.sl) + '</span>' : "");
      else h = '<span class="ja">' + jaHTML(c.ja, c.ro) + '</span><span class="ro">' + esc(c.ro) + '</span>' + (c.sl ? '<span class="sl">' + esc(c.sl) + '</span>' : "");
      flipCard($("fcCard"), function(){
        $("fcBack").innerHTML = h; $("fcBack").hidden = false; $("fcTap").hidden = true;
        $("fcNote").textContent = c.note || ""; $("fcNote").hidden = !c.note;
        $("fcSpeak").style.visibility = "visible";
      });
      $("fcActions").hidden = false;
    }
    function answer(ok){
      if (!flipped) return;
      grade(cur.c, ok);
      if (ok){ done++; if (!cur.missed) firstTry++; }
      else {
        cur.missed = true;
        if (!missedKeys[cur.c.k]){ missedKeys[cur.c.k] = 1; missed.push(cur.c); }
        var pos = Math.min(queue.length, 3 + Math.floor(Math.random() * 3));
        queue.splice(pos, 0, cur);
      }
      updateBadge(); next();
    }
    function finish(){
      $("fcBarFill").style.width = "100%";
      var st = streak();
      $("fcScore").innerHTML = '<b>' + firstTry + ' / ' + total + '</b>known on the first try' + (missed.length ? '<br>' + missed.length + ' card' + (missed.length > 1 ? 's' : '') + ' to review' : '<br>Perfect round!') + (st ? '<br><span class="streak">' + st + '-day streak</span>' : '');
      $("fcMissed").hidden = !missed.length;
      $("fcNew").textContent = cfg.mode === "due" ? "Back" : "New shuffle";
      view("done"); renderProgress(); updateBadge();
    }
    document.addEventListener("click", function(e){
      var t = e.target.closest("#pmCards button"); if (!t || t.hasAttribute("data-fav")) return;
      var seg = t.parentNode.getAttribute && t.parentNode.getAttribute("data-opt");
      if (seg){ cfg[seg] = t.getAttribute("data-v"); save(); renderSetup(); return; }
      if (t.hasAttribute("data-favonly")){ cfg.favOnly = !cfg.favOnly; save(); renderSetup(); return; }
      if (t.hasAttribute("data-srcset")){
        var ps = t.getAttribute("data-srcset").split(":"), isL = function(id){ return /^L\d/.test(id); };
        sources.forEach(function(s){ if ((ps[0] === "lessons") === isL(s.id)) cfg.src[s.id] = ps[1] === "all"; });
        save(); renderSetup(); return;
      }
      if (t.hasAttribute("data-src")){ var id = t.getAttribute("data-src"); cfg.src[id] = !cfg.src[id]; save(); renderSetup(); return; }
      switch (t.id){
        case "fcStart": start(selection()); break;
        case "fcToday": start(todayRound().list); break;
        case "fcCard": flip(); break;
        case "fcGot": answer(true); break;
        case "fcAgain": answer(false); break;
        case "fcStop": renderSetup(); view("setup"); break;
        case "fcMissed": start(missed.slice()); break;
        case "fcNew": if (cfg.mode === "due"){ renderSetup(); view("setup"); } else start(selection()); break;
        case "fcSettings": renderSetup(); view("setup"); break;
      }
    });
    window.FCrefresh = function(){ if (!$("fcSetup").hidden) renderSetup(); };
    renderSetup(); view("setup");
    function quick(num, dir){
      var list = pool.filter(function(c){ return c.src === "L" + num; });
      if (!list.length){ toast("No cards in this lesson yet", 1500); return; }
      start(list, dir);
    }
    function quickKeys(keys, dir){
      var set = {}; keys.forEach(function(k){ set[key(k)] = 1; });
      var list = pool.filter(function(c){ return set[c.k]; });
      if (!list.length){ toast("No cards here yet", 1500); return; }
      start(list, dir);
    }
    return { refresh: renderSetup, quick: quick, quickKeys: quickKeys };
  })();

  /* practice sub-sections */
  function showPm(name){
    if (["cards","kana","prices"].indexOf(name) < 0) name = "cards";
    Array.prototype.forEach.call(document.querySelectorAll("[data-pm]"), function(b){ b.setAttribute("aria-selected", b.getAttribute("data-pm") === name ? "true" : "false"); b.setAttribute("aria-checked", b.getAttribute("data-pm") === name ? "true" : "false"); });
    document.getElementById("pmCards").hidden = name !== "cards";
    document.getElementById("pmKana").hidden = name !== "kana";
    document.getElementById("pmPrices").hidden = name !== "prices";
    store.set("pm", name);
    if (name === "cards") FC.refresh();
    if (window.PRACTICE) window.PRACTICE.show(name);
  }
  document.addEventListener("click", function(e){ var b = e.target.closest("[data-pm]"); if (b) showPm(b.getAttribute("data-pm")); });

  document.addEventListener("click", function(e){
    var pq = e.target.closest("[data-pquiz]");
    if (pq){
      var a = pq.getAttribute("data-pquiz").split(":"), groups;
      if (a[0] === "f"){ var fam = FAMS.filter(function(f){ return f.key === a[1]; })[0]; groups = N.phraseGroups.filter(function(g){ return famOf(g) === fam; }); }
      else groups = [N.phraseGroups[+a[1]]];
      var keys = []; groups.forEach(function(g){ g.items.forEach(function(p){ keys.push(p[0]); }); });
      if (qEl.value){ qEl.value = ""; }
      show("cards"); showPm("cards"); FC.quickKeys(keys, a[2]); return;
    }
    var b = e.target.closest("[data-lquiz]"); if (!b) return;
    var p = b.getAttribute("data-lquiz").split(":");
    if (qEl.value){ qEl.value = ""; }
    show("cards"); showPm("cards"); FC.quick(+p[0], p[1]);
  });
  window.APP = { N: N, esc: esc, store: store, toast: toast, say: say, norm: norm, showPm: showPm, secHead: secHead, kanaBreak: kanaBreak };

  renderLessons(); renderPhrases(); renderKana();
  var APP_VERSION = "9 Nov 08:20";
  document.getElementById("updated").textContent = "Content " + N.updated;
  document.getElementById("ver").textContent = "App " + APP_VERSION;
  show(store.get("tab") || "lessons");
  showPm(store.get("pm") || "cards");
  var savedQuiz = store.get("quiz");
  setQuiz(savedQuiz === "1" ? "je" : savedQuiz);

  /* offline */
  var off = document.getElementById("offline");
  function net(){ off.textContent = navigator.onLine ? "" : "Offline · saved copy"; }
  window.addEventListener("online", net); window.addEventListener("offline", net); net();
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){ reg.update().catch(function(){}); }).catch(function(){});
    });
  }

  /* Theme: auto (follows the phone) → light → dark */
  var themeBtn = document.getElementById("themeBtn");
  var ICONS = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
  };
  var LABEL = { auto: "automatic (follows the phone)", light: "light", dark: "dark" };
  function applyTheme(t){
    if (t !== "light" && t !== "dark") t = "auto";
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.innerHTML = ICONS[t];
    themeBtn.setAttribute("aria-label", "Theme: " + LABEL[t] + ". Tap to change.");
    var dark = t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    Array.prototype.forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function(m){ m.setAttribute("content", dark ? "#1c1917" : "#F5F5F4"); m.removeAttribute("media"); });
    store.set("theme", t);
    return t;
  }
  var curTheme = applyTheme(store.get("theme"));
  themeBtn.addEventListener("click", function(){
    curTheme = applyTheme(curTheme === "auto" ? "light" : curTheme === "light" ? "dark" : "auto");
    toast("Theme: " + LABEL[curTheme], 1600);
  });
  if (window.matchMedia){ var mq = matchMedia("(prefers-color-scheme: dark)"); var onMq = function(){ if (curTheme === "auto") applyTheme("auto"); }; if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq); }

  /* Refresh button: clear the saved copy, drop the offline worker, reload fresh */
  var refreshBtn = document.getElementById("refreshBtn");
  function hardRefresh(){
    if (!navigator.onLine){ toast("You’re offline: the saved copy stays until you’re back online."); return; }
    refreshBtn.classList.add("spin");
    toast("Refreshing…", 2000);
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
    if ("serviceWorker" in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }));
    Promise.all(jobs).catch(function(){}).then(function(){
      location.replace(location.pathname + "?r=" + Date.now());
    });
  }
  refreshBtn.addEventListener("click", hardRefresh);

  /* Home Screen app resumed after a while: reload so new lessons show up */
  var hiddenAt = 0;
  document.addEventListener("visibilitychange", function(){
    if (document.hidden){ hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000 && navigator.onLine) location.reload();
  });
})();
</script>
<script>document.write('<script src="practice.js?r=' + Date.now() + '"><\/script>');</script>
<script>document.write('<script src="sync.js?r=' + Date.now() + '"><\/script>');</script>
</body>
