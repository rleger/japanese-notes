<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語ノート</title>
<meta name="description" content="Romain's Japanese study notes: hiragana, Pimsleur phrases, lesson by lesson.">
<meta name="theme-color" content="#F9FAFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F9FAFB; --ink:oklch(21% 0.034 264.665); --muted:oklch(44.6% 0.03 256.802); --soft:oklch(37.3% 0.034 259.733);
  --line:oklch(92.8% 0.006 264.531); --line-strong:oklch(87.2% 0.01 258.338); --card:#FFFFFF;
  --red:oklch(44.4% 0.177 26.899); --red-btn:oklch(44.4% 0.177 26.899); --indigo:oklch(37.2% 0.044 257.287); --chip:oklch(96.7% 0.003 264.542); --on-accent:#FFFFFF;
  --ctl-ink:oklch(37.3% 0.034 259.733); --tab-ink:oklch(55.1% 0.027 264.364);
  --sel-bg:oklch(96.8% 0.007 247.896); --sel-line:oklch(86.9% 0.022 252.894); --sel-ink:oklch(27.9% 0.041 260.031);
  --hot-bg:oklch(97.1% 0.013 17.38); --hot-line:oklch(88.5% 0.062 18.334); --hot-ink:oklch(50.5% 0.213 27.518);
  --bar-k:oklch(37.2% 0.044 257.287); --bar-l:oklch(86.9% 0.022 252.894); --pen:#334155;
  --shadow:0 1px 2px 0 rgb(0 0 0 / .05); --shadow-md:0 1px 3px 0 rgb(0 0 0 / .08), 0 1px 2px -1px rgb(0 0 0 / .08);
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",Georgia,serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:oklch(13% 0.028 261.692); --ink:oklch(96.7% 0.003 264.542); --muted:oklch(70.7% 0.022 261.325); --soft:oklch(87.2% 0.01 258.338); --line:oklch(27.8% 0.033 256.848); --line-strong:oklch(37.3% 0.034 259.733); --card:oklch(21% 0.034 264.665); --red:oklch(70.4% 0.191 22.216); --red-btn:oklch(44.4% 0.177 26.899); --indigo:oklch(86.9% 0.022 252.894); --chip:oklch(27.8% 0.033 256.848); --on-accent:oklch(13% 0.028 261.692); --shadow:0 0 #0000; --shadow-md:0 0 #0000; --ctl-ink:oklch(87.2% 0.01 258.338); --tab-ink:oklch(70.7% 0.022 261.325); --sel-bg:oklch(27.9% 0.041 260.031); --sel-line:oklch(44.6% 0.043 257.281); --sel-ink:oklch(96.8% 0.007 247.896); --hot-bg:oklch(57.7% 0.245 27.325 / .18); --hot-line:oklch(57.7% 0.245 27.325 / .4); --hot-ink:oklch(88.5% 0.062 18.334); --bar-k:oklch(86.9% 0.022 252.894); --bar-l:oklch(44.6% 0.03 256.802); --pen:#CBD5E1; }
}
:root[data-theme="dark"]{ --bg:oklch(13% 0.028 261.692); --ink:oklch(96.7% 0.003 264.542); --muted:oklch(70.7% 0.022 261.325); --soft:oklch(87.2% 0.01 258.338); --line:oklch(27.8% 0.033 256.848); --line-strong:oklch(37.3% 0.034 259.733); --card:oklch(21% 0.034 264.665); --red:oklch(70.4% 0.191 22.216); --red-btn:oklch(44.4% 0.177 26.899); --indigo:oklch(86.9% 0.022 252.894); --chip:oklch(27.8% 0.033 256.848); --on-accent:oklch(13% 0.028 261.692); --shadow:0 0 #0000; --shadow-md:0 0 #0000; --ctl-ink:oklch(87.2% 0.01 258.338); --tab-ink:oklch(70.7% 0.022 261.325); --sel-bg:oklch(27.9% 0.041 260.031); --sel-line:oklch(44.6% 0.043 257.281); --sel-ink:oklch(96.8% 0.007 247.896); --hot-bg:oklch(57.7% 0.245 27.325 / .18); --hot-line:oklch(57.7% 0.245 27.325 / .4); --hot-ink:oklch(88.5% 0.062 18.334); --bar-k:oklch(86.9% 0.022 252.894); --bar-l:oklch(44.6% 0.03 256.802); --pen:#CBD5E1; }
:root{ --st-bg:oklch(21% 0.034 264.665 / .6); --st-fg:oklch(96.7% 0.003 264.542); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --st-bg:oklch(13% 0.028 261.692 / .9); --st-fg:oklch(70.7% 0.022 261.325); } }
:root[data-theme="dark"]{ --st-bg:oklch(13% 0.028 261.692 / .9); --st-fg:oklch(70.7% 0.022 261.325); }
:root{ color-scheme: light dark; }
:root[data-theme="light"]{ color-scheme: light; }
:root[data-theme="dark"]{ color-scheme: dark; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.45}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}

header.top{padding:calc(14px + env(safe-area-inset-top)) 16px 0;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;border-radius:8px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:24px;transform:rotate(-3deg);flex-shrink:0}
.top h1{margin:0;font-family:var(--serif);font-size:22px;line-height:1.1}
.top p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.refresh{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.refresh svg{width:20px;height:20px}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:12px}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex;gap:4px;padding:0 12px}
nav.tabs button{-webkit-tap-highlight-color:transparent;flex:1;min-height:48px;background:none;border:0;border-bottom:3px solid transparent;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}

.tools{display:flex;gap:8px;align-items:center;padding:10px 0 2px;flex-wrap:nowrap}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:22px;background:var(--card);font-size:14px;font-weight:600;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--on-accent)}
.quizsel{order:2;flex-shrink:0;display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 2px 0 10px;border:1px solid var(--line-strong);border-radius:22px;background:var(--card);font-size:14px;font-weight:600}
.quizsel.on{background:var(--indigo);border-color:var(--indigo);color:var(--on-accent)}
.quizsel select{font:inherit;font-weight:600;color:inherit;background:transparent;border:0;min-height:38px;padding:0 2px;cursor:pointer;-webkit-appearance:none;appearance:none}
.quizsel select option{color:#111827}
.quizsel .chev{width:14px;height:14px;margin-right:8px}
.quizsel .qicon{width:18px;height:18px;flex-shrink:0}
.search{order:1;flex:1;min-width:0;position:relative}
.search .sicon{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:40px;border:1px solid var(--line-strong);border-radius:20px;padding:0 12px 0 36px;-webkit-appearance:none;appearance:none;font-size:16px;background:var(--card);color:var(--ink)}
.search label{position:absolute;left:-9999px}

h2.sec{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;font-family:var(--serif);font-size:19px}
h2.sec .dot{width:9px;height:9px;border-radius:50%;background:var(--red);align-self:center;flex-shrink:0}
h2.sec .jp{font-family:var(--jp);font-weight:400;font-size:15px;color:var(--red)}
h2.sec .count{margin-left:auto;font-family:var(--ui);font-size:12px;font-weight:600;color:var(--muted)}
p.hint{margin:0 0 10px;font-size:13px;color:var(--muted)}
p.qhint{margin:6px 0 0;font-size:12px}

/* phrase cards */
.card{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.card .body{flex:1;min-width:0}
.card .ja{font-family:var(--jp);font-size:22px;font-weight:400;letter-spacing:.02em;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.card .ro{font-weight:700;font-size:15px;margin-top:2px}
.card .en{font-size:15px;color:var(--soft)}
.card .sl{font-size:14px;color:var(--red);font-weight:500;margin-top:2px}
.card .note{font-size:13px;color:var(--muted);margin-top:4px;font-family:var(--jp)}
.card .num{font-size:12px;font-weight:700;color:var(--red);width:20px;padding-top:7px;flex-shrink:0}
.speak{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.speak svg{width:20px;height:20px}
.speak.mini{display:inline-flex;width:34px;height:34px;vertical-align:middle;margin-left:6px}
.speak.mini svg{width:16px;height:16px}
.speak:active{background:var(--chip)}
.speak.playing{background:var(--red);border-color:var(--red);color:#fff}
.kcell.playing{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.4;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:none}
.reveal{display:none;font-size:13px;color:var(--muted);margin-top:4px;font-style:italic}
/* quiz Japanese → English: hide English, sounds-like, notes */
body.quiz-je .card:not(.open) .en, body.quiz-je .card:not(.open) .sl, body.quiz-je .card:not(.open) .note{display:none}
body.quiz-je .card:not(.open) .reveal-en{display:block}
/* quiz English → Japanese: hide Japanese, rōmaji, sounds-like, notes, audio */
body.quiz-ej .card:not(.open) .ja, body.quiz-ej .card:not(.open) .ro, body.quiz-ej .card:not(.open) .sl, body.quiz-ej .card:not(.open) .note{display:none}
body.quiz-ej .card:not(.open) .speak{visibility:hidden}
body.quiz-ej .card:not(.open) .reveal-ja{display:block}
body.quiz-ej .card .en{font-size:17px;font-weight:600;color:var(--ink)}
body.quiz .card .body, body.quiz .line .txt{cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

/* kana grid */
.kgrid{display:grid;grid-template-columns:38px repeat(5,minmax(0,1fr));gap:5px}
.kgrid .h{font-size:12px;font-weight:700;color:var(--indigo);text-align:center;padding:2px 0}
.kgrid .lab{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--indigo)}
.kcell{min-height:62px;border:1px solid var(--line-strong);border-radius:6px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 2px}
.kcell .k{font-family:var(--jp);font-size:26px;line-height:1.1;font-weight:400}
.kcell .r{font-size:12px;font-weight:700}
.kcell .s{font-size:11px;color:var(--red);line-height:1.1;text-align:center}
.kcell.empty{border-style:dashed;border-color:var(--line);cursor:default}
.kcell.seen{border:2px solid var(--red)}
body.quiz-je .kcell:not(.open) .s{visibility:hidden}
body.quiz-ej .kcell:not(.open) .k{visibility:hidden}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.cgrid .kcell{min-height:54px}
.cgrid .kcell .k{font-size:21px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line-strong);border-radius:6px;padding:10px 12px;background:var(--card)}
.tile .big{font-family:var(--jp);font-size:24px;color:var(--indigo);letter-spacing:.08em}
.tile .t{font-weight:700;font-size:14px}
.tile .ex{font-family:var(--jp);font-size:20px;color:var(--red)}
.tile .exr{font-size:12px;font-weight:700;color:var(--indigo)}
.tile p{margin:4px 0 0;font-size:13px;color:var(--soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys span{font-size:13px;padding:4px 10px;border-radius:14px;background:var(--chip)}
.keys b{color:var(--indigo)}

/* lessons */
.lesson-head{display:flex;align-items:center;gap:10px;margin:22px 0 4px}
.lesson-head .badge{border:2px solid var(--indigo);color:var(--indigo);border-radius:6px;padding:2px 10px;font-family:var(--serif);font-weight:700;font-size:18px}
.lesson-head .jp{font-family:var(--jp);color:var(--red);font-size:17px;font-weight:400}
.subsec{margin:16px 0 0;padding-bottom:4px;border-bottom:2px solid var(--indigo);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo)}
.lesson-head .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
details.dlg{margin:12px 0 4px;border:1px solid var(--line-strong);border-radius:8px;padding:0 14px;background:var(--card)}
details.dlg summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-family:var(--serif);color:var(--indigo);cursor:pointer;list-style:none}
details.dlg summary::-webkit-details-marker{display:none}
details.dlg summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.dlg[open] summary::after{content:"－"}
.line{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.line .who{font-weight:700;color:var(--indigo);width:18px;padding-top:4px;flex-shrink:0}
.line .ja{font-family:var(--jp);font-size:19px;font-weight:400}
.line .ro{font-size:13px;font-weight:700}
.line .en{font-size:13px;color:var(--soft)}
body.quiz-je .line:not(.open) .en{display:none}
body.quiz-ej .line:not(.open) .ja, body.quiz-ej .line:not(.open) .ro{display:none}
body.quiz-ej .line:not(.open) .speak{visibility:hidden}
body.quiz .line:not(.open) .reveal-line{display:block}

.empty-state{padding:24px 0;color:var(--muted);text-align:center}
.jump{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jump::-webkit-scrollbar{display:none}
.jump button{flex-shrink:0;min-height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:18px;background:var(--card);font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lesson-head{scroll-margin-top:64px}
.kblock{min-width:0}

/* ---------- tablet & desktop ---------- */
@media (min-width: 760px){
  .wrap, header.top, nav.tabs .in{max-width:1180px}
  .wrap{padding-left:32px;padding-right:32px}
  header.top{padding-left:32px;padding-right:32px;padding-top:calc(22px + env(safe-area-inset-top))}
  nav.tabs .in{padding:0 28px;justify-content:flex-start;gap:8px}
  nav.tabs button{flex:0 0 auto;padding:0 18px}
  .seal{width:46px;height:46px;font-size:28px}
  .top h1{font-size:26px}
  .tools{max-width:620px;padding-top:18px}
  .jump{margin:0;padding:14px 0 4px}
  h2.sec{font-size:22px;margin-top:30px}

  /* words & phrases as cards */
  .group{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:stretch}
  .group > :not(.card){grid-column:1/-1}
  .card{border:1px solid var(--line);border-radius:16px;padding:16px 14px 16px 16px;background:var(--card);transition:border-color .15s, box-shadow .15s}
  .card:hover{border-color:var(--line-strong);box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .card .ja{font-size:23px;overflow-wrap:normal;word-break:normal;line-break:strict}
  .cgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .card .num{padding-top:8px}
  .lesson-head{margin:34px 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .lesson-head .badge{font-size:20px}
  .subsec{margin:14px 0 0}

  /* dialogues as a chat */
  details.dlg{margin:6px 0 4px;border-radius:16px;padding:0 20px}
  details.dlg .line{border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 14px;margin:8px 0;max-width:68%}
  details.dlg .line.who-B{margin-left:auto;background:var(--chip);border-color:transparent}
  details.dlg .line .ja{font-size:20px}

  /* kana */
  .kcell .k{font-size:30px}
  .kcell{min-height:70px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}

  /* flash cards centred */
  #fcSetup, #fcPlay, #fcDone{max-width:640px;margin-left:auto;margin-right:auto}
  .fc-card{min-height:380px}
  .fc-front.ja{font-size:40px}
}
@media (min-width: 1080px){
  #panel-kana:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:48px;align-items:start}
  #panel-kana .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* flash cards */
body.on-cards .tools, body.on-cards #quizHint{display:none !important}
.fc-opt{margin:14px 0}
.fc-lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:12px;overflow:hidden}
.seg button{min-height:46px;border:0;border-left:1px solid var(--line-strong);background:var(--card);font-size:15px;font-weight:600;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-checked="true"]{background:var(--indigo);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:0 14px;border:1px solid var(--line-strong);border-radius:20px;background:var(--card);font-size:14px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--on-accent)}
.fc-start{display:block;width:100%;min-height:52px;margin-top:20px;border:0;border-radius:14px;background:var(--red);color:var(--on-accent);font-size:17px;font-weight:700;cursor:pointer}
.fc-start:disabled{opacity:.45;cursor:default}
.fc-top{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;font-weight:600;color:var(--muted)}
.link{background:none;border:0;color:var(--red);font-weight:700;font-size:14px;min-height:40px;padding:0 4px;cursor:pointer;text-decoration:underline}
.fc-bar{height:4px;border-radius:2px;background:var(--line);margin:6px 0 14px;overflow:hidden}
.fc-bar span{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.fc-wrap{position:relative}
.fc-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:320px;padding:28px 20px 40px;border:1px solid var(--line-strong);border-radius:18px;background:var(--card);text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc-tag{position:absolute;top:14px;left:16px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fc-front{font-size:24px;font-weight:600;line-height:1.35}
.fc-front.ja{font-family:var(--jp);font-size:34px;font-weight:400}
.fc-front .ro{display:block;font-family:var(--ui);font-size:16px;font-weight:700;color:var(--soft);margin-top:6px}
.fc-back{display:flex;flex-direction:column;gap:4px;padding-top:14px;border-top:1px solid var(--line);width:100%}
.fc-back .ja{font-family:var(--jp);font-size:26px;font-weight:400}
.fc-back .ro{font-size:15px;font-weight:700}

.st-note{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;line-height:1.55;width:100%;max-width:none}
.st-tap{margin-top:22px}

.st-brk{width:56px;height:56px;border-radius:50%;border:1px solid var(--line-strong);background:var(--card);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:1px;padding-top:13px;color:var(--ctl-ink)}
.st-brk span:first-child{font-family:var(--jp);font-size:21px;line-height:1}
.st-brk-r{font-size:13px;font-weight:700;line-height:1}
.st-brk[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-ink)}
@media (max-width: 380px){ .st-bot{gap:8px} .st-say, .st-star, .st-brk{width:50px;height:50px} }
[hidden]{display:none !important}
</style>
</head>
<body>
<header class="top">
  <div class="seal" aria-hidden="true">学</div>
  <div style="flex:1;min-width:0">
    <h1>日本語ノート</h1>
    <p>Japanese study notes · Pimsleur</p>
  </div>
  <button type="button" class="refresh" id="themeBtn" aria-label="Theme: automatic"></button>
  <button type="button" class="refresh" id="refreshBtn" aria-label="Refresh and clear the saved copy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" id="tab-lessons" aria-controls="panel-lessons" data-tab="lessons">Lessons</button>
    <button role="tab" id="tab-phrases" aria-controls="panel-phrases" data-tab="phrases">Phrases</button>
    <button role="tab" id="tab-kana" aria-controls="panel-kana" data-tab="kana">Kana</button>
    <button role="tab" id="tab-cards" aria-controls="panel-cards" data-tab="cards">Practice<span class="badge-n" id="dueBadge" hidden></span></button>
  </div>
</nav>

<main class="wrap">
  <div class="tools">
    <label class="quizsel" id="quizWrap">
      <svg class="qicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <select id="quizSel" aria-label="Quiz mode">
        <option value="off">Quiz</option>
        <option value="je">JP → EN</option>
        <option value="ej">EN → JP</option>
      </select>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </label>
    <button type="button" class="rotoggle" id="roBtn" aria-pressed="false" aria-label="Hide rōmaji"><span>ro</span></button>
    <div class="search" id="searchBox" hidden>
      <svg class="sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q">Search phrases</label>
      <input id="q" type="search" placeholder="Search everything: eki, park, えき…" autocomplete="off">
    </div>
  </div>
  <p class="hint qhint" id="quizHint" hidden>English hidden: say what it means, then tap the card to check.</p>

  <section id="panel-lessons" role="tabpanel" aria-labelledby="tab-lessons"></section>
  <section id="panel-phrases" role="tabpanel" aria-labelledby="tab-phrases" hidden></section>
  <section id="searchResults" class="results" aria-live="polite" hidden></section>
  <section id="panel-kana" role="tabpanel" aria-labelledby="tab-kana" hidden></section>
  <section id="panel-cards" role="tabpanel" aria-labelledby="tab-cards" hidden>
    <div class="pm-seg seg" role="tablist" aria-label="Practice">
      <button type="button" role="tab" data-pm="cards">Cards</button>
      <button type="button" role="tab" data-pm="kana">Kana</button>
      <button type="button" role="tab" data-pm="prices">Prices</button>
    </div>
    <div id="pmCards">
    <div id="fcSetup">
      <div class="prog" id="fcProgress"></div>
      <div class="fc-opt"><span class="fc-lab" id="lbMode">Mode</span>
        <div class="seg seg2" role="radiogroup" aria-labelledby="lbMode" data-opt="mode">
          <button type="button" role="radio" data-v="due">Due today</button>
          <button type="button" role="radio" data-v="all">Shuffle all</button>
        </div>
        <p class="hint" id="fcModeHint" style="margin:6px 0 0"></p></div>
      <div class="fc-opt"><span class="fc-lab" id="lbContent">Content</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbContent" data-opt="content">
          <button type="button" role="radio" data-v="words">Words</button>
          <button type="button" role="radio" data-v="sentences">Sentences</button>
          <button type="button" role="radio" data-v="both">Both</button>
        </div></div>
      <div class="fc-opt"><span class="fc-lab" id="lbDir">Direction</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbDir" data-opt="dir">
          <button type="button" role="radio" data-v="je">JP → EN</button>
          <button type="button" role="radio" data-v="ej">EN → JP</button>
          <button type="button" role="radio" data-v="mix">Mixed</button>
        </div></div>
      <div class="fc-opt"><span class="fc-lab">From</span>
        <div class="chips" id="fcSources"></div></div>
      <button type="button" class="fc-start" id="fcStart">Start</button>
    </div>

    <div id="fcPlay" hidden>
      <div class="fc-top">
        <span id="fcProg"></span>
        <button type="button" class="link" id="fcStop">End</button>
      </div>
      <div class="fc-bar" aria-hidden="true"><span id="fcBarFill"></span></div>
      <div class="fc-wrap">
        <button type="button" class="fc-card" id="fcCard" aria-live="polite">
          <span class="fc-tag" id="fcTag"></span>
          <span class="fc-front" id="fcFront"></span>
          <span class="fc-back" id="fcBack" hidden></span>
          <span class="fc-tap" id="fcTap">Tap to flip</span>
        </button>
        <button type="button" class="star fc-star" id="fcStar" aria-pressed="false" aria-label="Add to favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
        <button type="button" class="speak fc-speak" id="fcSpeak" aria-label="Play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
      </div>
      <div class="fc-actions" id="fcActions" hidden>
        <button type="button" class="fc-again" id="fcAgain">Again</button>
        <button type="button" class="fc-got" id="fcGot">Got it</button>
      </div>
    </div>

    <div id="fcDone" hidden>
      <div class="fc-score" id="fcScore"></div>
      <div class="fc-actions">
        <button type="button" class="fc-again" id="fcMissed">Review missed</button>
        <button type="button" class="fc-got" id="fcNew">New shuffle</button>
      </div>
      <button type="button" class="link" id="fcSettings" style="display:block;margin:14px auto 0">Change settings</button>
    </div>
    </div>
    <div id="pmKana" hidden></div>
    <div id="pmPrices" hidden></div>
  </section>

  <footer class="foot">
    <span id="updated"></span>
    <span id="voice"></span>
    <span id="ver"></span>
    <span id="offline"></span>
  </footer>
</main>

<script>document.write('<script src="data.js?r=' + Date.now() + '"><\/script>');</script>
<script>
(function(){
  var N = window.NOTES;
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  var SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  /* speech (iOS Safari: speak inside the tap, never cancel+speak in the same tick) */
  var hasTTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  var jaVoice = null, voicesChecked = false, playingBtn = null, hintShown = false;
  function pickVoice(){
    if (!hasTTS) return;
    var vs = speechSynthesis.getVoices() || [];
    if (vs.length) voicesChecked = true;
    var ja = vs.filter(function(v){ return /^ja([-_]|$)/i.test(v.lang); });
    var score = function(v){
      var id = (v.name + " " + v.voiceURI).toLowerCase();
      return (/premium/.test(id) ? 4 : /enhanced|siri|neural|natural/.test(id) ? 3 : 0) + (v.localService ? 1 : 0);
    };
    ja.sort(function(a,b){ return score(b) - score(a); });
    jaVoice = ja[0] || null;
    var vl = document.getElementById("voice");
    if (vl && voicesChecked) vl.textContent = jaVoice ? "Voice: " + jaVoice.name + " (" + jaVoice.lang + ")" : "No Japanese voice installed";
  }
  if (hasTTS){
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", pickVoice);
    else speechSynthesis.onvoiceschanged = pickVoice;
  }
  var toastEl = null, toastTimer = null;
  function toast(msg, ms){
    if (!toastEl){ toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.setAttribute("role","status"); document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, ms || 3500);
  }
  function setPlaying(btn){
    if (playingBtn) playingBtn.classList.remove("playing");
    playingBtn = btn; if (btn) btn.classList.add("playing");
  }
  function speakNow(text, btn){
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.85; u.volume = 1;
    if (jaVoice) u.voice = jaVoice;
    u.onstart = function(){ setPlaying(btn); };
    u.onend = function(){ if (playingBtn === btn) setPlaying(null); };
    u.onerror = function(ev){
      if (playingBtn === btn) setPlaying(null);
      if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
      toast("Couldn’t play the voice (" + (ev && ev.error ? ev.error : "error") + ").");
    };
    speechSynthesis.speak(u);
    if (speechSynthesis.paused) speechSynthesis.resume();
  }
  function say(text, btn){
    if (!hasTTS){ toast("This browser has no speech voice."); return; }
    if (!jaVoice) pickVoice();
    if (voicesChecked && !jaVoice){
      toast("No Japanese voice on this device: Settings › Accessibility › Spoken Content › Voices › Japanese.", 6000);
    } else if (!hintShown){
      hintShown = true;
      toast("No sound? Turn off silent mode: iOS mutes the voice when the phone is on silent.", 4500);
    }
    if (speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      setTimeout(function(){ speakNow(text, btn); }, 120);
    } else {
      speakNow(text, btn);
    }
  }
  function speakBtn(text){ return '<button class="speak" type="button" data-say="'+esc(text)+'" aria-label="Play '+esc(text)+'">'+SPK+'</button>'; }

  /* search text: lower case, no macrons (kōen = koen) */
  function norm(s){ s = String(s || "").toLowerCase(); try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch(e){} return s; }

  /* every word, sentence, phrase and dialogue line is registered here (study view + search) */
  var ITEMS = {}, ORDER = [], seq = 0;
  function reg(o){
    o.id = "i" + (++seq); ITEMS[o.id] = o; ORDER.push(o.id);
    o.search = norm([o.ja, o.note, o.ro, o.en, o.sl, o.tag, o.sub].join(" "));
    return o;
  }
  function tagHTML(o){ return '<span class="tag t-'+o.type+'">'+esc(o.tag)+(o.sub ? ' · '+esc(o.sub) : '')+(o.who ? ' · '+esc(o.who) : '')+'</span>'; }
  function cardHTML(o, withTag){
    return '<div class="card k-'+o.type+'" data-id="'+o.id+'">'+
      (o.num && !withTag ? '<span class="num">'+o.num+'</span>' : '')+
      '<div class="body">'+
        (withTag ? tagHTML(o) : '')+
        '<div class="ja">'+esc(o.ja)+'</div>'+
        '<div class="ro">'+esc(o.ro)+'</div>'+
        (o.sl ? '<div class="sl">'+esc(o.sl)+'</div>' : '')+
        '<div class="reveal reveal-ja">Tap to study, the Japanese is hidden</div>'+
        '<div class="reveal reveal-en">Tap to study, the English is hidden</div>'+
        '<div class="en">'+esc(o.en)+'</div>'+
        (o.note ? '<div class="note">'+esc(o.note)+'</div>' : '')+
      '</div><div class="acts">'+ speakBtn(o.ja) + starBtn(o.ja) +
    '</div></div>';
  }
  function card(p, n, meta){
    meta = meta || {};
    return cardHTML(reg({ ja: p[0], note: p[1], ro: p[2], en: p[3], sl: p[4], num: n, type: meta.type || "phrase", tag: meta.tag || "Phrases", sub: meta.sub || "" }), false);
  }
  function cap(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
  /* favorites */
  function favKey(ja){ return String(ja).replace(/[。？?！、\s]/g, ""); }
  var favs = {};
  try { (JSON.parse(store.get("favs") || "[]") || []).forEach(function(k){ favs[k] = 1; }); } catch(e){}
  function isFav(ja){ return !!favs[favKey(ja)]; }
  function setFav(ja, on){ var k = favKey(ja); if (on) favs[k] = 1; else delete favs[k]; store.set("favs", JSON.stringify(Object.keys(favs))); }
  function starBtn(ja){ var on = isFav(ja); return '<button type="button" class="star" data-fav="'+esc(ja)+'" aria-pressed="'+(on?"true":"false")+'" aria-label="'+(on?"Remove from":"Add to")+' favorites">'+STAR_SVG+'</button>'; }
  var STAR_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
  function pad(i){ return (i < 9 ? "0" : "") + (i+1); }
  function secHead(title, jp, count){
    return '<h2 class="sec"><span class="dot" aria-hidden="true"></span>'+esc(title)+(jp ? ' <span class="jp">'+esc(jp)+'</span>' : '')+(count != null ? '<span class="count">'+count+'</span>' : '')+'</h2>';
  }

  /* lessons, newest first */
  function renderLessons(){
    var ls = N.lessons.slice().sort(function(a,b){ return b.number - a.number; });
    var h = '';
    if (!ls.length) h = '<p class="empty-state">No lessons yet.</p>';
    else h += '<div class="jump" role="navigation" aria-label="Jump to a lesson">' + ls.map(function(L){ return '<button type="button" data-jump="lesson-'+L.number+'">Lesson '+L.number+'</button>'; }).join("") + '</div>';
    ls.forEach(function(L){
      h += '<div class="group">';
      h += '<div class="lesson-head" id="lesson-'+L.number+'"><span class="badge">Lesson '+L.number+'</span><span class="jp">'+esc(L.jp||"")+'</span><span class="count">'+L.words.length+' words'+(L.sentences && L.sentences.length ? ' · '+L.sentences.length+' sentences' : '')+'</span></div>';
      var lt = "Lesson " + L.number;
      L.words.forEach(function(w,i){ h += card(w, pad(i), { type: "lesson", tag: lt, sub: /[。？?！]$/.test(w[0]) ? "Sentence" : "Word" }); });
      if (L.sentences && L.sentences.length){
        h += '<h3 class="subsec">Sentences</h3>';
        L.sentences.forEach(function(w,i){ h += card(w, pad(i), { type: "lesson", tag: lt, sub: "Sentence" }); });
      }
      var dlgs = L.dialogues || (L.dialogue && L.dialogue.length ? [{ title: L.dialogueTitle, note: L.dialogueNote, lines: L.dialogue }] : []);
      dlgs.forEach(function(D){
        h += '<details class="dlg"><summary>'+esc(D.title || "Put together · dialogue")+'</summary>';
        D.lines.forEach(function(d){
          var o = reg({ ja: d[1], ro: d[2], en: d[3], who: d[0], type: "lesson", tag: lt, sub: D.title || "Dialogue" });
          h += '<div class="line who-'+esc(d[0])+'" data-id="'+o.id+'"><span class="who">'+esc(d[0])+'</span><div class="txt" style="flex:1;min-width:0"><div class="ja">'+esc(d[1])+'</div><div class="ro">'+esc(d[2])+'</div><div class="en">'+esc(d[3])+'</div><div class="reveal reveal-line">Tap to check</div></div>'+speakBtn(d[1])+'</div>';
        });
        h += '<p class="hint" style="margin:8px 0 12px">'+esc(D.note || "Example built from this lesson’s words.")+'</p></details>';
      });
      h += '</div>';
    });
    document.getElementById("panel-lessons").innerHTML = h;
  }

  function renderPhrases(){
    var h = '<h2 class="sec" style="margin-top:12px"><span class="dot" aria-hidden="true"></span>How to read “sounds like”</h2><div class="keys">';
    N.soundKey.forEach(function(k){ h += '<span><b>'+esc(k[0])+'</b> '+esc(k[1])+'</span>'; });
    h += '</div>';
    h += '<div class="jump" role="navigation" aria-label="Jump to a section">' + N.phraseGroups.map(function(g, gi){ return '<button type="button" data-jump="pg-'+gi+'">'+esc(g.short || cap(g.title.replace(/^(Essentials|Survival): /, "")))+'</button>'; }).join("") + '</div>';
    N.phraseGroups.forEach(function(g, gi){
      h += '<div class="group" data-group="'+gi+'"><div class="anchor" id="pg-'+gi+'"></div>'+secHead(g.title, g.jp, g.items.length);
      var sub = g.short || cap(g.title.replace(/^(Essentials|Survival): /, ""));
      g.items.forEach(function(p,i){ h += card(p, pad(i), { type: "phrase", tag: "Phrases", sub: sub }); });
      h += '</div>';
    });
    document.getElementById("panel-phrases").innerHTML = h;
  }

  function kgrid(rows){
    var h = '<div class="kgrid"><span></span><span class="h">a</span><span class="h">i</span><span class="h">u</span><span class="h">e</span><span class="h">o</span>';
    rows.forEach(function(r){
      h += '<span class="lab">'+esc(r[0])+'</span>';
      r[1].forEach(function(c){
        if (!c){ h += '<span class="kcell empty" aria-hidden="true"></span>'; return; }
        h += '<button type="button" class="kcell" data-say="'+esc(c[0])+'" aria-label="'+esc(c[0]+" "+c[1])+'"><span class="k">'+esc(c[0])+'</span><span class="r">'+esc(c[1])+'</span>'+(c[2] ? '<span class="s">'+esc(c[2])+'</span>' : '')+'</button>';
      });
    });
    return h + '</div>';
  }
  function renderKana(){
    var h = '<div class="kblock">' + secHead("Hiragana", "ひらがな", 46) + '<p class="hint">Tap a character to hear it. Vowels keep their top‑row sound in every row (ka = kah).</p>' + kgrid(N.hiragana) + '</div>';
    h += '<div class="kblock">' + secHead("Two ticks ゛ and a circle ゜", "濁音") + '<p class="hint">か ka becomes が ga, は ha becomes ば ba or ぱ pa.</p>' + kgrid(N.dakuten);
    h += secHead("Combos with small ゃ ゅ ょ", "拗音") + '<p class="hint">き ki + small ゃ = きゃ kya, one syllable. Red frame: already in your phrases.</p><div class="cgrid">';
    N.combos.heads.forEach(function(hd){
      N.combos.smalls.forEach(function(s){
        var k = hd[0]+s[0], seen = N.combos.seen.indexOf(k) > -1;
        h += '<button type="button" class="kcell'+(seen?' seen':'')+'" data-say="'+esc(k)+'" aria-label="'+esc(k)+'"><span class="k">'+esc(k)+'</span><span class="r">'+esc(hd[1]+s[1])+'</span></button>';
      });
    });
    h += '</div></div>';
    h += '<div class="kblock">' + secHead("Look-alikes to watch", "似ている字") + '<div class="tiles">';
    N.lookAlikes.forEach(function(t){ h += '<div class="tile"><div class="big">'+esc(t[0])+'</div><p>'+esc(t[1])+'</p></div>'; });
    h += '</div></div><div class="kblock">' + secHead("Four reading rules", "読み方") + '<div class="tiles">';
    N.rules.forEach(function(t){ h += '<div class="tile"><div class="t">'+esc(t[0])+'</div><div class="ex">'+esc(t[1])+'</div><div class="exr">'+esc(t[2])+'</div><p>'+esc(t[3])+'</p></div>'; });
    h += '</div></div>';
    h += '<div class="kblock" id="writeBlock">' + secHead("Writing: stroke order", "書き順") + '<p class="hint">Pick a character to see the order of its strokes, then trace it with your finger.</p><div id="writeArea"></div></div>';
    document.getElementById("panel-kana").innerHTML = h;
  }

  /* tabs */
  var tabs = Array.prototype.slice.call(document.querySelectorAll("[data-tab]"));
  var currentTab = "lessons";
  function show(name){
    tabs.forEach(function(b){
      var on = b.getAttribute("data-tab") === name;
      b.setAttribute("aria-selected", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
      document.getElementById("panel-"+b.getAttribute("data-tab")).hidden = !on;
    });
    document.getElementById("searchBox").hidden = name === "kana" || name === "cards";
    document.body.classList.toggle("on-cards", name === "cards");
    currentTab = name;
    runSearch();
    store.set("tab", name);
    window.scrollTo(0,0);
  }
  tabs.forEach(function(b){ b.addEventListener("click", function(){ show(b.getAttribute("data-tab")); }); });

  /* quiz */
  var quizSel = document.getElementById("quizSel");
  var QUIZ_HINT = {
    je: "English hidden: say what it means, then tap the card to check.",
    ej: "Japanese hidden: say it in Japanese, then tap the card to check."
  };
  function setQuiz(mode){
    if (mode !== "je" && mode !== "ej") mode = "off";
    var b = document.body.classList;
    b.toggle("quiz", mode !== "off"); b.toggle("quiz-je", mode === "je"); b.toggle("quiz-ej", mode === "ej");
    quizSel.value = mode;

      if (ch === "ー"){ out.push({ k: ch, r: "", note: "long" }); continue; }
      var r = KANA[h];

    function bar(k, l, n){ var t = k + l + n || 1; return '<span class="pbar" aria-hidden="true"><i class="pk" style="width:'+(k/t*100)+'%"></i><i class="pl" style="width:'+(l/t*100)+'%"></i></span>'; }
    function renderProgress(){
      var tot = { known: 0, learning: 0, "new": 0 }, per = {};
      pool.forEach(function(c){ var lv = level(c); tot[lv]++; per[c.src] = per[c.src] || { known: 0, learning: 0, "new": 0 }; per[c.src][lv]++; });
      var st = streak(), h = '<div class="prog-top"><div><b>' + tot.known + '</b> known · ' + tot.learning + ' learning · ' + tot["new"] + ' new</div><div class="streak">' + (st ? st + '-day streak' : 'Start your streak today') + '</div></div>';
      h += bar(tot.known, tot.learning, tot["new"]);
      h += '<details class="prog-det"><summary>Progress by lesson</summary><div class="prog-rows">';
      sources.forEach(function(s){ var p = per[s.id]; if (!p) return; var t = p.known + p.learning + p["new"]; h += '<div class="prow"><span>' + esc(s.label) + '</span>' + bar(p.known, p.learning, p["new"]) + '<span class="pn">' + p.known + '/' + t + '</span></div>'; });
      h += '</div><p class="hint" style="margin:8px 0 0">Known = right 3 times in a row, spaced over days.</p></details>';
      $("fcProgress").innerHTML = h;
    }
    function renderSetup(){
      Array.prototype.forEach.call(document.querySelectorAll("#fcSetup .seg"), function(g){
        var opt = g.getAttribute("data-opt");
        Array.prototype.forEach.call(g.children, function(b){ b.setAttribute("aria-checked", b.getAttribute("data-v") === cfg[opt] ? "true" : "false"); });
      });
      var favN = pool.filter(function(c){ return isFav(c.ja); }).length;
      $("fcSources").innerHTML = '<button type="button" class="favchip" data-favonly aria-pressed="'+(cfg.favOnly ? "true" : "false")+'">★ Favorites only' + (favN ? ' (' + favN + ')' : '') + '</button>' +
        sources.map(function(s){ return '<button type="button" data-src="'+s.id+'" aria-pressed="'+(cfg.src[s.id] && !cfg.favOnly ? "true" : "false")+'"'+(cfg.favOnly ? ' disabled' : '')+'>'+esc(s.label)+'</button>'; }).join("");
      var f = filtered(), d = dueSplit(f), n = selection().length;
      $("fcModeHint").textContent = cfg.mode === "due"
        ? (d.due.length + " to review · " + d.fresh.length + " new (max " + NEW_PER_DAY + " new a day" + (d.freshAll > d.fresh.length ? ", " + (d.freshAll - d.fresh.length) + " waiting" : "") + ")")
        : "Every selected card, shuffled. Your answers still count for spaced repetition.";
      $("fcStart").textContent = n ? "Start · " + n + " cards" : (cfg.mode === "due" ? "All done for today ✓" : "No cards for this choice");
      $("fcStart").disabled = !n;
      renderProgress(); updateBadge();
    }
    function view(which){ $("fcSetup").hidden = which !== "setup"; $("fcPlay").hidden = which !== "play"; $("fcDone").hidden = which !== "done"; }
    function start(list){
      queue = shuffle(list.map(function(c){ return { c: c, dir: cfg.dir === "mix" ? (Math.random() < .5 ? "je" : "ej") : cfg.dir, missed: false }; }));
      total = queue.length; done = 0; firstTry = 0; missed = []; missedKeys = {};
      view("play"); next(); window.scrollTo(0,0);
    }
    function setStar(){ var on = isFav(cur.c.ja); $("fcStar").setAttribute("aria-pressed", on ? "true" : "false"); $("fcStar").setAttribute("data-fav", cur.c.ja); }
    function next(){
      if (!queue.length){ finish(); return; }
      cur = queue.shift(); flipped = false;
      var c = cur.c, lv = level(c);
      $("fcProg").textContent = (done + 1) + " / " + total + (firstTry ? "  ·  ✓ " + firstTry : "");
      $("fcBarFill").style.width = Math.round(done / total * 100) + "%";
      $("fcTag").textContent = (cur.dir === "je" ? "Japanese → English" : "English → Japanese") + (lv === "new" ? " · new" : "");
      var f = $("fcFront");
      if (cur.dir === "je"){ f.className = "fc-front ja"; f.innerHTML = esc(c.ja) + '<span class="ro">' + esc(c.ro) + '</span>'; }
      else { f.className = "fc-front"; f.textContent = cleanEn(c.en); }
      $("fcBack").hidden = true; $("fcTap").hidden = false; $("fcActions").hidden = true;
      $("fcSpeak").style.visibility = cur.dir === "je" ? "visible" : "hidden";
      $("fcSpeak").setAttribute("data-say", c.ja);
      setStar();
    }
    function flip(){
      if (!cur || flipped) return;
      flipped = true; var c = cur.c, h = "";
      if (cur.dir === "je") h = (document.body.classList.contains("no-ro") ? '<span class="ro">' + esc(c.ro) + '</span>' : '') + '<span class="en">' + esc(c.en) + '</span>' + (c.sl ? '<span class="sl">' + esc(c.sl) + '</span>' : "");
      else h = '<span class="ja">' + esc(c.ja) + '</span><span class="ro">' + esc(c.ro) + '</span>' + (c.sl ? '<span class="sl">' + esc(c.sl) + '</span>' : "");
      if (c.note) h += '<span class="note">' + esc(c.note) + '</span>';
      $("fcBack").innerHTML = h; $("fcBack").hidden = false; $("fcTap").hidden = true; $("fcActions").hidden = false;
      $("fcSpeak").style.visibility = "visible";
    }
    function answer(ok){
      if (!flipped) return;
      grade(cur.c, ok);
      if (ok){ done++; if (!cur.missed) firstTry++; }
      else {
        cur.missed = true;
        if (!missedKeys[cur.c.k]){ missedKeys[cur.c.k] = 1; missed.push(cur.c); }
        var pos = Math.min(queue.length, 3 + Math.floor(Math.random() * 3));
        queue.splice(pos, 0, cur);
      }
      updateBadge(); next();
    }
    function finish(){
      $("fcBarFill").style.width = "100%";
      var st = streak();
      $("fcScore").innerHTML = '<b>' + firstTry + ' / ' + total + '</b>known on the first try' + (missed.length ? '<br>' + missed.length + ' card' + (missed.length > 1 ? 's' : '') + ' to review' : '<br>Perfect round!') + (st ? '<br><span class="streak">' + st + '-day streak</span>' : '');
      $("fcMissed").hidden = !missed.length;
      $("fcNew").textContent = cfg.mode === "due" ? "Back" : "New shuffle";
      view("done"); renderProgress(); updateBadge();
    }
    document.addEventListener("click", function(e){
      var t = e.target.closest("#pmCards button"); if (!t || t.hasAttribute("data-fav")) return;
      var seg = t.parentNode.getAttribute && t.parentNode.getAttribute("data-opt");
      if (seg){ cfg[seg] = t.getAttribute("data-v"); save(); renderSetup(); return; }
      if (t.hasAttribute("data-favonly")){ cfg.favOnly = !cfg.favOnly; save(); renderSetup(); return; }
      if (t.hasAttribute("data-src")){ var id = t.getAttribute("data-src"); cfg.src[id] = !cfg.src[id]; save(); renderSetup(); return; }
      switch (t.id){
        case "fcStart": start(selection()); break;
        case "fcCard": flip(); break;
        case "fcGot": answer(true); break;
        case "fcAgain": answer(false); break;
        case "fcStop": renderSetup(); view("setup"); break;
        case "fcMissed": start(missed.slice()); break;
        case "fcNew": if (cfg.mode === "due"){ renderSetup(); view("setup"); } else start(selection()); break;
        case "fcSettings": renderSetup(); view("setup"); break;
      }
    });
    window.FCrefresh = function(){ if (!$("fcSetup").hidden) renderSetup(); };
    renderSetup(); view("setup");
    return { refresh: renderSetup };
  })();

  /* practice sub-sections */
  function showPm(name){
    if (["cards","kana","prices"].indexOf(name) < 0) name = "cards";
    Array.prototype.forEach.call(document.querySelectorAll("[data-pm]"), function(b){ b.setAttribute("aria-selected", b.getAttribute("data-pm") === name ? "true" : "false"); b.setAttribute("aria-checked", b.getAttribute("data-pm") === name ? "true" : "false"); });
    document.getElementById("pmCards").hidden = name !== "cards";
    document.getElementById("pmKana").hidden = name !== "kana";
    document.getElementById("pmPrices").hidden = name !== "prices";
    store.set("pm", name);
    if (name === "cards") FC.refresh();
    if (window.PRACTICE) window.PRACTICE.show(name);
  }
  document.addEventListener("click", function(e){ var b = e.target.closest("[data-pm]"); if (b) showPm(b.getAttribute("data-pm")); });

  window.APP = { N: N, esc: esc, store: store, toast: toast, say: say, norm: norm, showPm: showPm, secHead: secHead };

  renderLessons(); renderPhrases(); renderKana();
  var APP_VERSION = "2 Nov 23:55";
  document.getElementById("updated").textContent = "Content " + N.updated;
  document.getElementById("ver").textContent = "App " + APP_VERSION;
  show(store.get("tab") || "lessons");
  showPm(store.get("pm") || "cards");
  var savedQuiz = store.get("quiz");
  setQuiz(savedQuiz === "1" ? "je" : savedQuiz);

  /* offline */
  var off = document.getElementById("offline");
  function net(){ off.textContent = navigator.onLine ? "" : "Offline · saved copy"; }
  window.addEventListener("online", net); window.addEventListener("offline", net); net();
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){ reg.update().catch(function(){}); }).catch(function(){});
    });
  }

  /* Theme: auto (follows the phone) → light → dark */
  var themeBtn = document.getElementById("themeBtn");
  var ICONS = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
  };
  var LABEL = { auto: "automatic (follows the phone)", light: "light", dark: "dark" };
  function applyTheme(t){
    if (t !== "light" && t !== "dark") t = "auto";
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.innerHTML = ICONS[t];
    themeBtn.setAttribute("aria-label", "Theme: " + LABEL[t] + ". Tap to change.");
    var dark = t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    Array.prototype.forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function(m){ m.setAttribute("content", dark ? "#030712" : "#F9FAFB"); m.removeAttribute("media"); });
    store.set("theme", t);
    return t;
  }
  var curTheme = applyTheme(store.get("theme"));
  themeBtn.addEventListener("click", function(){
    curTheme = applyTheme(curTheme === "auto" ? "light" : curTheme === "light" ? "dark" : "auto");
    toast("Theme: " + LABEL[curTheme], 1600);
  });
  if (window.matchMedia){ var mq = matchMedia("(prefers-color-scheme: dark)"); var onMq = function(){ if (curTheme === "auto") applyTheme("auto"); }; if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq); }

  /* Refresh button: clear the saved copy, drop the offline worker, reload fresh */
  var refreshBtn = document.getElementById("refreshBtn");
  function hardRefresh(){
    if (!navigator.onLine){ toast("You’re offline: the saved copy stays until you’re back online."); return; }
    refreshBtn.classList.add("spin");
    toast("Refreshing…", 2000);
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
    if ("serviceWorker" in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }));
    Promise.all(jobs).catch(function(){}).then(function(){
      location.replace(location.pathname + "?r=" + Date.now());
    });
  }
  refreshBtn.addEventListener("click", hardRefresh);

  /* Home Screen app resumed after a while: reload so new lessons show up */
  var hiddenAt = 0;
  document.addEventListener("visibilitychange", function(){
    if (document.hidden){ hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000 && navigator.onLine) location.reload();
  });
})();
</script>
<script>document.write('<script src="practice.js?r=' + Date.now() + '"><\/script>');</script>
</body>
</html>
